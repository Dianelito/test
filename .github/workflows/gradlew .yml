name: "Minecraft Plugin CI/CD - Build & Test"
# Sólo se disparará cuando exista un Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened]
# Es necesario para poder hacer comentarios en el Pull Request
permissions:
  contents: read
  pull-requests: write
jobs:
  build:
    name: "Compile Plugin (Java ${{ matrix.java }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # No cancelar si otra versión falla
      matrix:
        java: [17, 21]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Set up JDK ${{ matrix.java }}"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle' # Cámbialo a 'maven' si usas pom.xml en vez de build.gradle
      - name: "Build plugin"
        # Ajusta este comando a 'mvn clean package -B' si estás usando Maven.
        run: ./gradlew build
      - name: "Upload Artifacts (JAR)"
        uses: actions/upload-artifact@v4
        with:
          name: plugin-java-${{ matrix.java }}
          # Ajusta la ruta a target/*.jar si usas maven
          path: build/libs/*-all.jar # Sugerimos el fat-jar o tu jar final compilado
  test:
    name: "Test on PaperMC ${{ matrix.paper-version }} (Java ${{ matrix.java }})"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # (Nota: Asumo que te referías a 1.21.1 porque 1.21.11 no existe. Puedes ajustar la versión exacta)
          - java: 21
            paper-version: "1.21.1" 
          - java: 17
            paper-version: "1.20.4"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Set up JDK ${{ matrix.java }}"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: "Download Completed Built Plugin"
        uses: actions/download-artifact@v4
        with:
          name: plugin-java-${{ matrix.java }}
          path: plugins-dir
      - name: "Setup PaperMC Server"
        run: |
          mkdir -p server/plugins
          # Mover los plugins descargados al folder del server de papermc
          mv plugins-dir/*.jar server/plugins/
          # Aceptar el eula obligatoriamente
          echo "eula=true" > server/eula.txt
          
          # Descargar la última build de PaperMC usando la API REST v2
          cd server
          PAPER_VERSION="${{ matrix.paper-version }}"
          BUILD=$(curl -s "https://api.papermc.io/v2/projects/paper/versions/$PAPER_VERSION" | jq -r '.builds[-1]')
          echo "Downloading Paper version $PAPER_VERSION build $BUILD..."
          curl -so paper.jar "https://api.papermc.io/v2/projects/paper/versions/$PAPER_VERSION/builds/$BUILD/downloads/paper-$PAPER_VERSION-$BUILD.jar"
      - name: "Run Server and Test Plugin"
        run: |
          cd server
          # Arrancar con poca RAM para que no agote la free tier runner de GitHub Actions
          java -Xmx512M -jar paper.jar --nogui &
          SERVER_PID=$!
          
          # Variables de timeout (2 minutos)
          TIMEOUT=120
          ELAPSED=0
          
          # Verificar Logs hasta decir "Done" o encontrar errores
          while true; do
            if [ -f logs/latest.log ]; then
              if grep -q 'Done' logs/latest.log 2>/dev/null; then
                echo "✅ El servidor ha cargado exitosamente!"
                break
              fi
              # Si detecta que no se pudo iniciar el plugin o hubo excepción
              if grep -iqE '(Could not load|Exception initializing|Error occurred while)' logs/latest.log 2>/dev/null; then
                echo "❌ Error crítico cargando el plugin, revisando el log:"
                cat logs/latest.log
                kill -9 $SERVER_PID
                exit 1
              fi
            fi
            sleep 5
            ELAPSED=$((ELAPSED+5))
            if [ $ELAPSED -gt $TIMEOUT ]; then
              echo "⏱️ Timeout esperado 2 minutos para el arranque del servidor. Abortando."
              cat logs/latest.log
              kill -9 $SERVER_PID
              exit 1
            fi
          done
          
          # Matamos cordialmente el servidor al terminar la comprobación
          kill $SERVER_PID
      - name: "Comment on PR if test fails"
        if: failure()
        uses: mshick/add-pr-comment@v2
        with:
           # GitHub usa este token autogenerado por omisión
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## ❌ ¡Cuidado! Tu plugin tiene problemas de compatibilidad/ejecución
            Hubo un error al querer iniciar el servidor de pruebas en **PaperMC ${{ matrix.paper-version }}** usando **Java ${{ matrix.java }}**.
            El plugin no compila correctamente, o tira un error de consola (tipo `Exception initializing` o `Could not load`).
            🔍 Revisa la pestaña de **Actions** para leer los logs detallados e identificar qué clase detonó el problema y así poder arreglarlo antes de fusionar este código.
